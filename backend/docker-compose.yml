services:
  postgres:
    image: postgres:16-alpine
    container_name: studypair-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: studypair
      POSTGRES_PASSWORD: studypair
      POSTGRES_DB: studypair
    ports:
      - "5433:5432"
    volumes:
      - studypair_postgres_data:/var/lib/postgresql/data

volumes:
  studypair_postgres_data:
